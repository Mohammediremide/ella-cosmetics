# Cancels unpaid orders past the window set in Admin → Settings and puts their stock back (safe to repeat).
# Free alternative to Render cron jobs. Needs two repository secrets: DATABASE_URL and DJANGO_SECRET_KEY
# (GitHub repo → Settings → Secrets and variables → Actions → New repository secret).
# Until both exist the run finishes GREEN with a notice and does nothing.
name: expire-unpaid-orders
on:
  schedule: [{ cron: "17 * * * *" }]   # hourly
  workflow_dispatch: {}                 # lets you run it by hand from the Actions tab
jobs:
  expire:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_DEBUG: "false"
      FRONTEND_ORIGIN: https://placeholder.invalid   # required by the settings file, unused by this job
      ALLOW_LOCAL_MEDIA: "true"                      # this job touches no images
    steps:
      - name: Check secrets
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DJANGO_SECRET_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Order expiry is NOT running. Add the DATABASE_URL and DJANGO_SECRET_KEY repository secrets to turn it on."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true'
        with: { python-version: "3.12" }   # no pip cache: it errors when the install is skipped and saves little on an hourly job
      - name: Run expire_orders
        if: steps.cfg.outputs.ready == 'true'
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py expire_orders
